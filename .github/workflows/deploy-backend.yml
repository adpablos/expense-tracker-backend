name: Deploy Backend to Railway

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to (staging|production)'
        required: true
        default: 'staging'

env:
  RAILWAY_PROJECT_ID: 70472fbf-60d6-4ada-99ff-114188b18939
  BACKEND_SERVICE_NAME: backend

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Railway CLI
        run: npm i -g @railway/cli@^4

      - name: Railway auth
        run: railway auth --token ${{ secrets.RAILWAY_TOKEN }}

      - name: Link project
        run: railway link --project $RAILWAY_PROJECT_ID

      - name: Select environment
        id: env
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TARGET_ENV="${{ github.event.inputs.environment }}"
          else
            if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
              TARGET_ENV="production"
            else
              TARGET_ENV="staging"
            fi
          fi
          echo "TARGET_ENV=$TARGET_ENV" >> $GITHUB_OUTPUT

      - name: Link environment
        run: railway environment ${{ steps.env.outputs.TARGET_ENV }}

      - name: Deploy to Railway
        run: railway up --service "$BACKEND_SERVICE_NAME" --ci

      - name: Smoke test (backend health)
        env:
          BACKEND_HEALTH_URL: ${{ secrets.BACKEND_HEALTH_URL }}
        run: |
          if [ -n "$BACKEND_HEALTH_URL" ]; then
            echo "Hitting $BACKEND_HEALTH_URL ..."
            curl -fsSL --retry 6 --retry-delay 5 "$BACKEND_HEALTH_URL" | jq .status | grep -qi ok
            echo "Backend smoke test OK"
          else
            echo "Skipping smoke test: BACKEND_HEALTH_URL not set"
          fi








